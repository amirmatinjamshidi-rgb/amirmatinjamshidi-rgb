name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: amirmatinjamshidi-rgb

      - name: Commit and push generated assets
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d profile-3d-contrib ]; then
            echo "::error::Expected folder profile-3d-contrib was not generated. Check the upstream action logs above."
            ls -la
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib

          if git diff --staged --quiet; then
            echo "No changes to commit (SVGs already up to date)."
            exit 0
          fi

          git commit -m "chore: update profile 3d contrib assets"
          git push origin HEAD:${{ github.ref_name }}
